services:
   social-media:
       build:
           context: .
       ports:
           - "8000:8000"
       command: >
           sh -c "python manage.py makemigrations &&
                  python manage.py migrate &&
                  python manage.py runserver 0.0.0.0:8000"
       volumes:
         - ./:/app
         - my_media:/files/media
       env_file:
           - .env
       depends_on:
         db:
           condition: service_healthy

   db:
       image: postgres:14-alpine
       restart: always
       ports:
           - "5432:5432"
       env_file:
           - .env
       volumes:
         - my_db:$PGDATA
       healthcheck:
         test: [ "CMD", "pg_isready" ]
         interval: 10s
         timeout: 5s
         retries: 5

volumes:
  my_db:
  my_media:
